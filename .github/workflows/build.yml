name: Build CMCC RAX3000Q (main + NSS)

# Builds one image: OpenWrt main + the NSS-on-6.18 series, for the CMCC
# RAX3000Q / RAX3000-QY (IPQ5018 + QCA8337 + QCN6102, 256 MB RAM, 128 MB
# SPI-NAND, Dosilicon DS35Q1GA or GigaDevice GD5F1GQ5REYIG).
#
# The baseline follows the head of openwrt-nss-edma's c3po-tag-8021q branch
# on every build; `base_ref` pins a commit when a reproducible build is
# wanted.

# Manual only.  A full image costs ~90 minutes of runner time, so pushes and
# pull requests must NOT start one: go to Actions -> "Build CMCC RAX3000Q" ->
# Run workflow when a new image is actually wanted.  `prepare_only` gives a
# ~5 minute config/tree check without building anything.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'openwrt-nss-edma commit/branch (empty = latest c3po-tag-8021q)'
        required: false
        default: ''
      make_release:
        description: 'Publish a GitHub release with the images'
        type: boolean
        required: false
        default: true
      prepare_only:
        description: 'Stop after the tree is prepared and verified (no build)'
        type: boolean
        required: false
        default: false

env:
  BASE_REPO: https://github.com/kuncy7/openwrt-nss-edma.git
  # Moving branch: every build takes its current head (kernel 6.18.60 today)
  BASE_BRANCH: c3po-tag-8021q
  # A preparation-only run checks the tree and .config in ~5 minutes instead
  # of discovering a dropped symbol after a 90-minute build.
  PREPARE_ONLY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.prepare_only) || 'false' }}
  TZ: Asia/Shanghai

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    # Only the release step needs this; GITHUB_TOKEN is read-only by default.
    permissions:
      contents: write

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: rax3000q

      - name: Free up disk space
        # A full ipq50xx build needs ~26 GB; a stock runner leaves ~14 free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            bzip2 build-essential clang flex bison g++ gawk gcc git \
            gettext glibc-source libncurses-dev libssl-dev make rsync swig \
            python3-setuptools unzip zlib1g-dev file wget zstd libelf-dev \
            u-boot-tools device-tree-compiler
          sudo timedatectl set-timezone "$TZ" || true

      - name: Checkout the NSS base tree
        env:
          REF: ${{ github.event.inputs.base_ref }}
        run: |
          set -euo pipefail
          git init --quiet openwrt
          git -C openwrt remote add origin "$BASE_REPO"
          if [ -n "${REF:-}" ]; then
            git -C openwrt fetch --quiet --depth 1 origin "$REF"
          else
            git -C openwrt fetch --quiet --depth 1 origin "$BASE_BRANCH"
          fi
          git -C openwrt checkout --quiet FETCH_HEAD
          git -C openwrt log -1 --format='base %h  %ci  %s'
          echo "BASE_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >>"$GITHUB_ENV"

      - name: Prepare the tree
        # setup.sh applies the three source patches, installs the Dosilicon
        # backport / BDF / fullcone patches, seeds the rootfs overlay, wires the
        # extra feeds, seeds .config and verifies every boot-critical symbol
        # and file. It fails in minutes, not after a 90-minute build.
        run: bash -x rax3000q/scripts/setup.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Verify boot-critical board support
        # Belt and braces next to setup.sh: this is the difference between a
        # router that boots and one that never mounts its root filesystem.
        run: |
          set -eu
          cd openwrt
          P=target/linux/qualcommax/patches-6.18/0810-mtd-spinand-add-support-for-Dosilicon-DS35Q1GA-DS35M1GA.patch
          [ -f "$P" ] || { echo "::error::missing $P"; exit 1; }
          grep -q 'DS35Q1GA' "$P" || { echo "::error::Dosilicon patch is incomplete"; exit 1; }
          grep -q 'SPINAND_MFR_DOSILICON' "$P" || { echo "::error::no manufacturer id in the patch"; exit 1; }
          DTS=target/linux/qualcommax/dts/ipq5018-rax3000q.dts
          grep -q 'nand-ecc-strength = <4>' "$DTS" || { echo "::error::wrong SPI-NAND ECC strength"; exit 1; }
          grep -q 'ubi.mtd=rootfs' "$DTS" || { echo "::error::missing ubi.mtd=rootfs"; exit 1; }
          grep -q 'ipq5018-nss.dtsi' "$DTS" || { echo "::error::the board has no NSS node"; exit 1; }
          echo "Dosilicon driver, 4-bit ECC, UBI bootargs and the NSS node are in place"

      - name: Compute the cache period key
        id: cacheperiod
        # A key unique to each workflow run never matched on restore, so
        # every successful run archived a full copy of the caches.  Rotate
        # weekly instead: the first run of an ISO week saves, later runs
        # that week restore it and actions/cache skips the redundant save.
        run: echo "week=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"

      - name: Restore the download cache (dl/)
        if: env.PREPARE_ONLY != 'true'
        # First successful run fills this cache; later runs pull the source
        # tarballs from the GitHub Actions cache instead of refetching them
        # from sources.openwrt.org (which is slow or unreachable from the
        # runners often enough to burn the whole download step).
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ steps.cacheperiod.outputs.week }}
          restore-keys: |
            openwrt-dl-

      - name: Download sources
        if: env.PREPARE_ONLY != 'true'
        timeout-minutes: 120
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          set -euo pipefail
          cd openwrt
          ok=0
          for attempt in 1 2 3 4; do
            if timeout --kill-after=60 20m make download -j"$(nproc)"; then ok=1; break; fi
            echo "::warning::download attempt $attempt failed or hit the 20 minute limit"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::sources could not be downloaded"; exit 1; }
          # A sub-1 KiB "archive" in dl/ is a truncated or error-page
          # response.  Restrict to archive names so tiny, legitimate files
          # (READMEs, checksum stubs) aren't collateral damage.
          find dl -type f \( -name '*.tgz' -o -name '*.tar.*' -o -name '*.zip' -o \
               -name '*.gz' -o -name '*.bz2' -o -name '*.xz' \) -size -1024c -print -delete || true

      - name: Check the board DTS references
        if: env.PREPARE_ONLY != 'true'
        # dtc reports a missing label at minute 95 of a 95-minute build: after
        # the kernel, the toolchain and every package, in target/linux/install.
        # Preparing the kernel tree (which the build does anyway) puts the real
        # ipq5018.dtsi, with its OpenWrt patches, on disk - so the same check
        # can run as text in seconds. It caught q6_wcss_pd1/q6_wcss_pd2, which
        # upstream's rax3000q DTS still uses and this kernel no longer has.
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" target/linux/prepare
          KDIR=$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-* 2>/dev/null | tail -n 1)
          if [ -z "$KDIR" ]; then
              echo "::error::kernel build dir not found after target/linux/prepare"
              exit 1
          fi
          echo "kernel tree: $KDIR"
          python3 ../rax3000q/scripts/check-dts-labels.py \
            target/linux/qualcommax/dts/ipq5018-rax3000q.dts \
            target/linux/qualcommax/dts \
            target/linux/qualcommax/files/arch/arm64/boot/dts/qcom \
            target/linux/qualcommax/patches-6.18 \
            "$KDIR/arch/arm64/boot/dts/qcom"

      - name: Compute ccache key
        id: ccache
        if: env.PREPARE_ONLY != 'true'
        run: |
          set -euo pipefail
          cd openwrt
          tree=$(git rev-parse HEAD:toolchain)
          sum=$({ echo "$tree"; echo "$BASE_COMMIT"; grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL)_' .config; gcc --version; as --version; } \
                | sha256sum | cut -c1-16)
          echo "prefix=ccache-rax3000q-${sum}-" >>"$GITHUB_OUTPUT"

      - name: Restore ccache
        if: env.PREPARE_ONLY != 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ steps.cacheperiod.outputs.week }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      - name: Build
        if: env.PREPARE_ONLY != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          cd openwrt
          if ! make -j"$(nproc)"; then
            echo "::warning::parallel build failed, replaying the remainder serially"
            make -j1 V=s 2>&1 | tail -400
            exit 1
          fi
          staging_dir/host/bin/ccache -s || true
          df -h / | tail -1

      - name: Collect build metadata
        if: success() && env.PREPARE_ONLY != 'true'
        run: |
          set -eu
          cd openwrt
          {
            echo "device=cmcc,rax3000q"
            echo "base_repo=$BASE_REPO"
            echo "base_commit=$BASE_COMMIT"
            echo "project_commit=$(git -C "$GITHUB_WORKSPACE/rax3000q" rev-parse --short HEAD)"
            KVER=$(basename "$(ls -d build_dir/target-*/linux-qualcommax_ipq50xx/linux-* | tail -n 1)")
            echo "kernel=${KVER#linux-}"
            echo "nss_firmware=$(grep -m1 '^CONFIG_NSS_FIRMWARE_VERSION' .config | cut -d= -f1 | sed 's/.*VERSION_//')"
            echo "mem_profile=nss LOW / ath11k 256M"
            echo "bdf_ipq5018_sha256=$(sha256sum "$GITHUB_WORKSPACE/rax3000q/openwrt/tree/package/ipq-wifi-cmcc_rax3000q/files/board-2.bin.IPQ5018" | cut -d' ' -f1)"
            echo "bdf_qcn6122_sha256=$(sha256sum "$GITHUB_WORKSPACE/rax3000q/openwrt/tree/package/ipq-wifi-cmcc_rax3000q/files/board-2.bin.QCN6122" | cut -d' ' -f1)"
            echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } | tee "$GITHUB_WORKSPACE/build-info.txt"
          echo "DATE=$(date '+%Y%m%d_%H%M%S')" >>"$GITHUB_ENV"
          echo "FIRMWARE=$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx" >>"$GITHUB_ENV"

      - name: Verify the produced images
        if: success() && env.PREPARE_ONLY != 'true'
        run: |
          set -eu
          ls -lh "$FIRMWARE"
          for pat in '*-squashfs-sysupgrade.bin' '*-squashfs-factory.ubi'; do
            n=$(find "$FIRMWARE" -maxdepth 1 -name "$pat" | wc -l)
            echo "$pat : $n file(s)"
            [ "$n" -ge 1 ] || { echo "::error::missing $pat"; exit 1; }
          done

      - name: Write the release notes
        if: success() && env.PREPARE_ONLY != 'true'
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          IPQ=openwrt/bin/targets/qualcommax/ipq50xx
          {
            echo "OpenWrt **main** with Qualcomm **NSS** offload for the **CMCC RAX3000Q / RAX3000-QY**."
            echo
            echo "The wired path is offloaded into the NSS core of the SoC; Wi-Fi offload (wifili) is"
            echo "built in and validated on this board. The switch keeps its DSA"
            echo "driver and is spoken to in plain 802.1Q (\`qca-8021q\` tagger), so \`lan1\`-\`lan3\`"
            echo "and \`wan\` stay the interfaces they are on a stock image. Kernel 6.18, built for"
            echo "256 MB (ath11k 256M + NSS LOW). Fullcone NAT (on by default) and LuCI/Argon/UPnP"
            echo "are included."
            echo
            echo "This image also carries the **Dosilicon DS35Q1GA / DS35M1GA** SPI-NAND driver, which"
            echo "mainline 6.18 lacks: without it the board cannot mount its root filesystem at all."
            echo
            echo "| file | use |"
            echo "|---|---|"
            echo "| \`*-squashfs-factory.ubi\` | first flash from the vendor U-Boot over TFTP: \`tftpboot <pc>:<file>.ubi\` then \`flash rootfs\` |"
            echo "| \`*-squashfs-sysupgrade.bin\` | upgrade a router already running OpenWrt: \`sysupgrade <file>\` (kept configs are repaired on first boot) |"
            echo
            echo "Default LAN address is **192.168.1.1**. Both radios come up enabled as"
            echo "\`RAX3000Q-2G\` / \`RAX3000Q-5G\`, **open with no password** - set a key in"
            echo "LuCI -> Network -> Wireless before using it anywhere that matters. 802.11k/v"
            echo "are active on the open network; 802.11r becomes active once a key is set."
            echo
            echo "### First boot, what to check"
            echo
            echo '```'
            echo 'dmesg | grep -i "spi-nand"        # "Dosilicon SPI NAND was found. 128 MiB"'
            echo 'iw dev                            # phy0-ap0 / phy1-ap0, both radios up'
            echo 'ls /etc/rc.d | grep S19nss          # the arming service is installed'
            echo 'cat /sys/kernel/debug/qca-dwmac-nss/status   # phys_if 1: started dev=eth0'
            echo 'logread -e nss                      # "NSS wired plane + ECM up"'
            echo 'cat /sys/kernel/debug/ecm/ecm_nss_ipv4/tcp_accelerated_count  # >0 under traffic'
            echo '```'
            echo
            echo "If the plane did not arm, the router still routes on the host path - same topology, no"
            echo "firmware offload. \`uci set nss.general.enabled=0\` makes that the permanent choice."
            echo
            echo '```'
            cat build-info.txt
            echo '```'
            echo
            echo "sha256:"
            echo '```'
            grep -E 'sysupgrade\.bin|factory\.ubi' "$IPQ/sha256sums" || cat "$IPQ/sha256sums"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Upload images
        if: success() && env.PREPARE_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cmcc_rax3000q-nss-main_${{ env.DATE }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.ubi
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
            build-info.txt
          if-no-files-found: error

      - name: Publish release
        if: >-
          success() && env.PREPARE_ONLY != 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event.inputs.make_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.DATE }}
          name: CMCC RAX3000Q NSS (main) ${{ env.DATE }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ env.FIRMWARE }}/*-squashfs-sysupgrade.bin
            ${{ env.FIRMWARE }}/*-squashfs-factory.ubi
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
          fail_on_unmatched_files: true

      - name: Upload the preparation record
        # Always, also on success: this is the artifact that answers "which
        # symbol did defconfig drop" when the job log is gone (a cancelled or
        # re-run job keeps no log, and that is exactly when it is needed).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-report
          include-hidden-files: true
          path: |
            openwrt/setup-checks.txt
            openwrt/.config
            openwrt/feeds-setup.log
            openwrt/defconfig.log
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          include-hidden-files: true
          path: |
            openwrt/logs/**
            openwrt/setup-checks.txt
            openwrt/.config
            openwrt/feeds-setup.log
            openwrt/defconfig.log
          if-no-files-found: ignore
